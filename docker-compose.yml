name: sonris
# Local: un solo contenedor en http://localhost:8080 con el sitio y el modo edición.
#   docker compose up --build dev
#
# Sirve el sitio COMPILADO con Apache + PHP, como Hostinger, porque el modo edición
# reescribe ese HTML al publicar. No hay recarga en caliente: al guardar un cambio de
# código, el contenedor recompila solo (unos segundos) y basta con recargar la página.
# Lo editado desde el navegador se vuelve a aplicar tras cada compilación.
#   docker compose logs -f dev     → ver cuándo termina de compilar
#
# Producción: la imagen nginx del Dockerfile, con dist/ compilado dentro. Es lo que
# se despliega, y sí hay que reconstruirla en cada cambio.
#   docker compose --profile prod up --build web
services:
  dev:
    build: docker/apache
    ports:
      - "8080:80"
    volumes:
      - .:/app
      # node_modules propio del contenedor: sus binarios nativos son de Linux
      # (Debian) y pisarían los de macOS que usa `npm run dev` en el equipo.
      - modulos:/app/node_modules
      # .astro/, la salida compilada y la caché de imágenes en un mismo volumen, fuera
      # del árbol de macOS: Astro mueve archivos entre ellos con rename(), que no
      # cruza sistemas de archivos.
      - compilado:/app/.astro
      # Datos del modo edición (administrador, textos e imágenes editados). Fuera de
      # la salida: Astro la vacía en cada compilación.
      - cms_storage:/var/www/almacen
      - cms_subidas:/var/www/subidas

  web:
    profiles: [prod]
    build: .
    ports:
      - "8080:80"

volumes:
  modulos:
  compilado:
  cms_storage:
  cms_subidas:
