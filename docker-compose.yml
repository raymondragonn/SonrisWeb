# Desarrollo: el servidor de Astro corre dentro del contenedor con el código montado,
# así que los cambios en src/ se ven en http://localhost:8080 sin reconstruir la imagen.
#   docker compose up dev
#
# Producción: la imagen nginx del Dockerfile, con dist/ compilado dentro. Es lo que
# se despliega, y sí hay que reconstruirla en cada cambio.
#   docker compose --profile prod up --build web
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      # node_modules propio del contenedor: sus binarios nativos son de Linux y
      # pisarían los de macOS que usa `npm run dev` en el equipo.
      - node_modules:/app/node_modules
      # .astro/ fuera del bind mount: ahí Astro guarda el PID del dev server, y el
      # archivo de un contenedor muerto hace que el siguiente aborte con
      # "Another astro dev server is already running".
      - astro_cache:/app/.astro
    environment:
      # Activa el polling de Vite (ver astro.config.mjs): los eventos de inotify
      # no cruzan de forma fiable el bind mount de macOS.
      DOCKER_DEV: "1"
    command: sh -c "[ -d node_modules/astro ] || npm ci; npm run dev -- --force --host 0.0.0.0 --port 8080"

  web:
    profiles: [prod]
    build: .
    ports:
      - "8080:80"

volumes:
  node_modules:
  astro_cache:
