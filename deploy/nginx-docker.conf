# Generado por scripts/generar-redirecciones.mjs. No editar a mano.
# Fuente: src/data/redirecciones.js
# 32 reglas 301 + 1 regla 410, más normalización de barra final y www.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Barra final obligatoria, salvo en archivos con extensión.
  rewrite ^([^.]*[^/])$ $1/ permanent;

  location = /como-ponerse-el-alineador/ { return 301 /ortodoncia-invisalign/#como-funciona; }
  location = /primera-consulta-gratuita/ { return 301 /ortodoncia-invisalign/#primera-visita; }
  location = /ventajas-ortodoncia-invisible/ { return 301 /ortodoncia-invisalign/#tecnologia; }
  location = /tecnologia/ { return 301 /ortodoncia-invisalign/#tecnologia; }
  location = /centro-ortodoncia-invisible-madrid/ { return 301 /sobre-nosotros/; }
  location = /equipo/ { return 301 /sobre-nosotros/#equipo; }
  location = /blanqueamiento-dental/ { return 301 /tratamientos/estetica-dental/#blanqueamiento; }
  location = /carillas-dentales/ { return 301 /tratamientos/estetica-dental/#carillas; }
  location = /estetica-dental-2/ { return 301 /tratamientos/estetica-dental/; }
  location = /endodoncia-2/ { return 301 /tratamientos/endodoncia/; }
  location = /odontologia-general-2/ { return 301 /tratamientos/odontologia-general/; }
  location = /implantes-dentales/ { return 301 /tratamientos/implantes-dentales/; }
  location = /cirugia-ortognatica/ { return 301 /tratamientos/cirugia-ortognatica/; }
  location = /cirugia-oral/ { return 301 /tratamientos/cirugia-oral/; }
  location = /periodoncia/ { return 301 /tratamientos/periodoncia/; }
  location = /contacto-sonris/ { return 301 /contacto/; }
  location = /politica-privacidad/ { return 301 /politica-de-privacidad/; }
  location = /financiacion-ortodoncia-invisible-madrid/ { return 301 /contacto/; }
  location = /blog/ { return 301 /; }
  location = /blog/ortodoncia-invisible-precio/ { return 301 /contacto/; }
  location = /blog/cuanto-dura-la-ortodoncia-invisible/ { return 301 /ortodoncia-invisalign/#tipos; }
  location = /blog/invisalign-o-brackets/ { return 301 /ortodoncia-invisalign/#que-es; }
  location = /blog/como-limpiar-los-alineadores/ { return 301 /ortodoncia-invisalign/#faq; }
  location = /blog/ortodoncia-invisible-en-adultos/ { return 301 /ortodoncia-invisalign/; }
  location = /blog/ortodoncia-invisible-para-ninos/ { return 301 /ortodoncia-invisalign/#tipos; }
  location = /blog/que-son-los-ataches/ { return 301 /ortodoncia-invisalign/#faq; }
  location = /blog/retenedores-despues-de-la-ortodoncia/ { return 301 /ortodoncia-invisalign/#faq; }
  location = /blog/escaner-itero-que-es/ { return 301 /ortodoncia-invisalign/#tecnologia; }
  location = /blog/dental-monitoring-como-funciona/ { return 301 /ortodoncia-invisalign/#tecnologia; }
  location = /blog/apinamiento-dental/ { return 301 /ortodoncia-invisalign/#tipos; }
  location = /blog/mordida-cruzada-tratamiento/ { return 301 /tratamientos/cirugia-ortognatica/; }
  location = /blog/blanqueamiento-en-casa-o-en-clinica/ { return 301 /tratamientos/estetica-dental/#blanqueamiento; }
  location = /identifica-tu-caso/ { return 410; }

  # Los assets con hash en el nombre son inmutables; el HTML, no.
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location ~* \.(png|svg|jpg|jpeg|webp|woff2)$ { expires 30d; add_header Cache-Control "public"; }
  location ~* \.html$ { add_header Cache-Control "no-cache"; }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;

  error_page 404 /404.html;
  location / { try_files $uri $uri/index.html =404; }
}
